name: 4xhelos
recipe: drupal7
config:
  # Set Xdebug off by default. We use the tooling below to turn it on as needed.
  php: 7.4
  xdebug: false

services:
  appserver:
    type: php:7.4
    overrides:
      environment:
        XDEBUG_MODE: 'debug,develop'
    build_as_root:
      - cp /app/.lando/php.ini /usr/local/etc/php/conf.d/php-custom.ini  
  database:
    type: mysql:5.7
    creds:
      user: drupal7
      password: drupal7
      database: drupal7
  
  phpmyadmin:
    type: phpmyadmin
    hosts:
      - database

tooling:
  xdebug-on:
    service: appserver
    description: Enable Xdebug.
    user: root
    cmd:
      - docker-php-ext-enable xdebug && kill -USR2 $(pgrep -o php-fpm) > /dev/null || /etc/init.d/apache2 reload
      - tput setaf 2 && echo "Xdebug On" && tput sgr 0 && echo

  xdebug-off:
    service: appserver
    description: Disable Xdebug.
    user: root
    cmd:
      - rm /usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini && kill -USR2 $(pgrep -o php-fpm) > /dev/null || /etc/init.d/apache2 reload
      - tput setaf 1 && echo "Xdebug Off" && tput sgr 0 && echo

  phpmyadmin:
    service: phpmyadmin